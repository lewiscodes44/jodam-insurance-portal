spring.application.name=jodam-insurance-portal

spring.datasource.url=jdbc:postgresql://localhost:5432/jodam_insurance_portal
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true

# JWT Configuration
security.jwt.secret=${JWT_SECRET:}
security.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# Administrator Bootstrap Configuration
bootstrap.admin.enabled=${BOOTSTRAP_ADMIN_ENABLED:true}
bootstrap.admin.username=${BOOTSTRAP_ADMIN_USERNAME:admin}
bootstrap.admin.email=${BOOTSTRAP_ADMIN_EMAIL:admin@jodam.co.ke}
bootstrap.admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}
bootstrap.admin.first-name=${BOOTSTRAP_ADMIN_FIRST_NAME:System}
bootstrap.admin.last-name=${BOOTSTRAP_ADMIN_LAST_NAME:Administrator}
bootstrap.admin.phone=${BOOTSTRAP_ADMIN_PHONE:0700000000}

# M-PESA Daraja Configuration
mpesa.consumer-key=${MPESA_CONSUMER_KEY:}
mpesa.consumer-secret=${MPESA_CONSUMER_SECRET:}
mpesa.passkey=${MPESA_PASSKEY:}
mpesa.shortcode=${MPESA_SHORTCODE:}
mpesa.callback-url=${MPESA_CALLBACK_URL:}

mpesa.oauth-url=${MPESA_OAUTH_URL:https://sandbox.safaricom.co.ke/oauth/v1/generate?grant_type=client_credentials}
mpesa.stk-push-url=${MPESA_STK_PUSH_URL:https://sandbox.safaricom.co.ke/mpesa/stkpush/v1/processrequest}

# Notification Dispatch Configuration
notification.dispatch.enabled=false
notification.dispatch.fixed-delay=30000

# Email Configuration
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}

# Development diagnostics
logging.level.org.springframework.security=TRACE
logging.level.org.springframework.web.servlet.mvc.method.annotation.RequestMappingHandlerMapping=TRACE

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE